
name: Databricks Stock MLOps CI/CD

on:
  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        type: choice
        options:
          - dev
          - test
          - prod

permissions:
  contents: read

concurrency:
  group: stock-mlops-${{ github.ref }}
  cancel-in-progress: false

env:
  DATABRICKS_HOST: https://dbc-01667042-21c0.cloud.databricks.com

jobs:

  # ==================================================
  # 1. DEV - VALIDATION AND DEPLOYMENT
  # ==================================================

  deploy-dev:

    name: DEV - Code Validation and Deploy

    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.environment == 'dev')

    runs-on: ubuntu-latest

    environment: dev

    env:
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------
      # Find Databricks Bundle Root
      # ----------------------------------------------

      - name: Find Databricks Bundle Root
        shell: bash
        run: |
          echo "Searching for databricks.yml..."

          BUNDLE_FILE=$(find "$GITHUB_WORKSPACE/dev" \
            -type f \
            -name "databricks.yml" \
            -print -quit)

          if [ -z "$BUNDLE_FILE" ]; then
            echo "ERROR: databricks.yml not found inside dev!"
            echo "Available files:"
            find "$GITHUB_WORKSPACE/dev" -maxdepth 6 -type f
            exit 1
          fi

          BUNDLE_ROOT=$(dirname "$BUNDLE_FILE")

          echo "Bundle file: $BUNDLE_FILE"
          echo "Bundle root: $BUNDLE_ROOT"

          echo "DATABRICKS_BUNDLE_ROOT=$BUNDLE_ROOT" >> "$GITHUB_ENV"

      # ----------------------------------------------
      # Python Setup and Testing
      # ----------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff numpy pandas pyyaml scikit-learn

      - name: Run Ruff
        run: |
          cd "$DATABRICKS_BUNDLE_ROOT"
          ruff check .

      

      # ----------------------------------------------
      # Databricks CLI
      # ----------------------------------------------

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate DEV Bundle
        run: |
          databricks bundle validate -t dev

      - name: Deploy DEV Bundle
        if: github.event_name == 'workflow_dispatch'
        run: |
          databricks bundle deploy -t dev



  # ==================================================
  # 2. TEST - VALIDATION AND DEPLOYMENT
  # ==================================================

  deploy-test:

    name: TEST - Validate and Train

    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'test'

    runs-on: ubuntu-latest

    environment: test

    env:
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------
      # Find Databricks Bundle Root
      # ----------------------------------------------

      - name: Find Databricks Bundle Root
        shell: bash
        run: |
          echo "Searching for databricks.yml..."

          BUNDLE_FILE=$(find "$GITHUB_WORKSPACE/dev" \
            -type f \
            -name "databricks.yml" \
            -print -quit)

          if [ -z "$BUNDLE_FILE" ]; then
            echo "ERROR: databricks.yml not found inside dev!"
            echo "Available files:"
            find "$GITHUB_WORKSPACE/dev" -maxdepth 6 -type f
            exit 1
          fi

          BUNDLE_ROOT=$(dirname "$BUNDLE_FILE")

          echo "Bundle file: $BUNDLE_FILE"
          echo "Bundle root: $BUNDLE_ROOT"

          echo "DATABRICKS_BUNDLE_ROOT=$BUNDLE_ROOT" >> "$GITHUB_ENV"

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate TEST Bundle
        run: |
          databricks bundle validate -t test

      - name: Deploy TEST Bundle
        run: |
          databricks bundle deploy -t test

      - name: Run TEST Setup Job
        run: |
          databricks bundle run stock_setup_job -t test

      - name: Run TEST Training Job
        run: |
          databricks bundle run stock_training_job -t test


  # ==================================================
  # 3. PROD - VALIDATION AND DEPLOYMENT
  # ==================================================

  deploy-prod:

    name: PROD - Validate and Promote Model

    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'prod'

    runs-on: ubuntu-latest

    environment: prod

    env:
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------
      # Find Databricks Bundle Root
      # ----------------------------------------------

      - name: Find Databricks Bundle Root
        shell: bash
        run: |
          echo "Searching for databricks.yml..."

          BUNDLE_FILE=$(find "$GITHUB_WORKSPACE/dev" \
            -type f \
            -name "databricks.yml" \
            -print -quit)

          if [ -z "$BUNDLE_FILE" ]; then
            echo "ERROR: databricks.yml not found inside dev!"
            echo "Available files:"
            find "$GITHUB_WORKSPACE/dev" -maxdepth 6 -type f
            exit 1
          fi

          BUNDLE_ROOT=$(dirname "$BUNDLE_FILE")

          echo "Bundle file: $BUNDLE_FILE"
          echo "Bundle root: $BUNDLE_ROOT"

          echo "DATABRICKS_BUNDLE_ROOT=$BUNDLE_ROOT" >> "$GITHUB_ENV"

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate PROD Bundle
        run: |
          databricks bundle validate -t prod

      - name: Deploy PROD Bundle
        run: |
          databricks bundle deploy -t prod

      - name: Run PROD Setup Job
        run: |
          databricks bundle run stock_setup_job -t prod

      - name: Promote Champion Model
        run: |
          databricks bundle run stock_promote_job -t prod
