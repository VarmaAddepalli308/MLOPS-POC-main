
name: Databricks Stock MLOps CI/CD

on:
  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      environment:
        description: "Select Environment"
        required: true
        type: choice
        options:
          - dev
          - test
          - prod

permissions:
  contents: read

concurrency:
  group: stock-mlops-${{ github.ref }}
  cancel-in-progress: false

env:
  DATABRICKS_HOST: https://dbc-01667042-21c0.cloud.databricks.com
  DATABRICKS_BUNDLE_ROOT: ${{ github.workspace }}

jobs:

  # ==========================================
  # 1. DEV - VALIDATE AND DEPLOY
  # ==========================================

  deploy-dev:

    name: DEV - Validate and Deploy

    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.environment == 'dev')

    runs-on: ubuntu-latest

    environment: dev

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Bundle Root
        run: |
          echo "Checking Databricks bundle root..."
          pwd
          ls -la

          if [ ! -f "databricks.yml" ]; then
            echo "ERROR: databricks.yml not found!"
            exit 1
          fi

          echo "Databricks bundle root found."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff numpy pandas pyyaml scikit-learn

      - name: Run Ruff
        run: |
          ruff check .

      - name: Run Unit Tests
        run: |
          pytest -q

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate DEV Bundle
        run: |
          databricks bundle validate -t dev
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Deploy DEV Bundle
        if: github.event_name == 'workflow_dispatch'
        run: |
          databricks bundle deploy -t dev
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Run DEV Setup Job
        if: github.event_name == 'workflow_dispatch'
        run: |
          databricks bundle run stock_setup_job -t dev
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Run DEV Training Job
        if: github.event_name == 'workflow_dispatch'
        run: |
          databricks bundle run stock_training_job -t dev
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}


  # ==========================================
  # 2. TEST - VALIDATE AND DEPLOY
  # ==========================================

  deploy-test:

    name: TEST - Validate and Deploy

    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'test'

    runs-on: ubuntu-latest

    environment: test

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Bundle Root
        run: |
          echo "Checking Databricks bundle root..."
          pwd
          ls -la

          if [ ! -f "databricks.yml" ]; then
            echo "ERROR: databricks.yml not found!"
            exit 1
          fi

          echo "Databricks bundle root found."

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate TEST Bundle
        run: |
          databricks bundle validate -t test
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Deploy TEST Bundle
        run: |
          databricks bundle deploy -t test
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Run TEST Setup Job
        run: |
          databricks bundle run stock_setup_job -t test
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Run TEST Training Job
        run: |
          databricks bundle run stock_training_job -t test
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}


  # ==========================================
  # 3. PROD - VALIDATE AND DEPLOY
  # ==========================================

  deploy-prod:

    name: PROD - Validate and Deploy

    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'prod'

    runs-on: ubuntu-latest

    environment: production

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Bundle Root
        run: |
          echo "Checking Databricks bundle root..."
          pwd
          ls -la

          if [ ! -f "databricks.yml" ]; then
            echo "ERROR: databricks.yml not found!"
            exit 1
          fi

          echo "Databricks bundle root found."

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate PROD Bundle
        run: |
          databricks bundle validate -t prod
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Deploy PROD Bundle
        run: |
          databricks bundle deploy -t prod
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Run PROD Setup Job
        run: |
          databricks bundle run stock_setup_job -t prod
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Promote Champion Model
        run: |
          databricks bundle run stock_promote_job -t prod
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
