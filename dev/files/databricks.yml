# This is a Declarative Automation Bundle definition for stock_price_prediction_mlops.

bundle:
  name: stock_price_prediction_mlops
  uuid: 7b3e5a52-9c1d-4f6e-8a47-2d0c61f3b9e4

include:
  - resources/*.yml

variables:
  catalog:
    description: "Catalog used by the stock ML project (overridden per target)"
    default: "stock_demo"

  schema:
    description: "Schema holding the raw/bronze table"
    default: "bronze"

  max_validation_rmse:
    description: "Optional absolute validation-RMSE ceiling for the evaluation gate. Empty = conf/project.yml"
    default: ""

  min_improvement:
    description: "Relative validation-RMSE improvement required to replace the champion. Empty = conf/project.yml"
    default: ""

  champion_version:
    description: "Unused now: the serving endpoint is created/updated by src/serve.py from the champion alias"
    default: "1"

targets:
  # =========================
  # DEV
  # =========================
  dev:
    mode: development
    default: true

    workspace:
      host: https://dbc-01667042-21c0.cloud.databricks.com

    variables:
      catalog: stock_demo
      schema: bronze

  # =========================
  # TEST
  # =========================
  test:
    mode: production

    workspace:
      host: https://dbc-01667042-21c0.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

    variables:
      catalog: stock_demo_test
      schema: bronze

  # =========================
  # PROD
  # =========================
  prod:
    mode: production

    workspace:
      host: https://dbc-01667042-21c0.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

    variables:
      catalog: stock_demo_prod
      schema: bronze

    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
