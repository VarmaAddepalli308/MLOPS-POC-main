[project]
name = "stock_price_prediction_mlops"
version = "1.0.0"
authors = [{ name = "<YOUR-NAME-OR-EMAIL>" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    # Libraries used by the Databricks jobs are provided by the Databricks runtime;
    # these are needed for local tests and tooling.
    "mlflow>=2.14",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "databricks-sdk>=0.30",
    "xgboost>=2.1,<3",
    "lightgbm>=4.5,<5",
    "catboost>=1.2,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: needs a Spark / Databricks Connect session (skipped when unavailable)"]

[tool.ruff]
line-length = 120
# Names injected by the Databricks notebook runtime
builtins = ["dbutils", "spark", "display", "displayHTML"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501"]   # notebooks: imports after %pip / widget cells
