# Hyperparameter search spaces. Delete a block to skip that regression algorithm.
# Search uses expanding, date-grouped CV (not random row folds).
# ElasticNet keys are applied to the Pipeline reg__ step.
elastic_net:
  alpha: [0.0001, 0.001, 0.01, 0.1, 1.0]
  l1_ratio: [0.1, 0.3, 0.5, 0.7, 0.9]
  max_iter: [5000, 10000]

random_forest:
  n_estimators: [150, 250, 400]
  max_depth: [6, 10, 16, null]
  min_samples_leaf: [5, 10, 25, 50]
  max_features: [0.6, 0.8, 1.0]
  max_samples: [0.5, 0.75, 1.0]

extra_trees:
  n_estimators: [150, 250, 400]
  max_depth: [6, 10, 16, null]
  min_samples_leaf: [5, 10, 25, 50]
  max_features: [0.6, 0.8, 1.0]

hist_gradient_boosting:
  max_iter: [150, 250, 400]
  learning_rate: [0.02, 0.04, 0.07, 0.1]
  max_leaf_nodes: [7, 15, 31]
  min_samples_leaf: [20, 40, 80]
  l2_regularization: [0.0, 0.1, 1.0, 5.0]

gradient_boosting:
  n_estimators: [100, 200, 300]
  learning_rate: [0.02, 0.04, 0.07, 0.1]
  max_depth: [1, 2, 3]
  min_samples_leaf: [10, 25, 50]
  subsample: [0.6, 0.8, 1.0]

# Optional: these run when the matching Python package is installed on the cluster.
xgboost:
  n_estimators: [200, 400, 600]
  max_depth: [2, 3, 5, 7]
  learning_rate: [0.02, 0.04, 0.07]
  subsample: [0.7, 0.85, 1.0]
  colsample_bytree: [0.6, 0.8, 1.0]
  reg_lambda: [1.0, 5.0, 10.0]

lightgbm:
  n_estimators: [200, 400, 600]
  num_leaves: [7, 15, 31]
  max_depth: [-1, 4, 6, 8]
  learning_rate: [0.02, 0.04, 0.07]
  min_child_samples: [20, 40, 80]
  reg_lambda: [0.0, 1.0, 5.0]

catboost:
  iterations: [200, 400, 600]
  depth: [4, 6, 8]
  learning_rate: [0.02, 0.04, 0.07]
  l2_leaf_reg: [1.0, 3.0, 7.0]
