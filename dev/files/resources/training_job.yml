
resources:
  jobs:
    stock_training_job:
      name: stock_training_job

      tasks:
        - task_key: ingest_live_data
          environment_key: stock_env
          notebook_task:
            notebook_path: ../src/ingest_live.ipynb
            base_parameters:
              catalog: ${var.catalog}

        - task_key: build_features
          environment_key: stock_env
          depends_on:
            - task_key: ingest_live_data
          notebook_task:
            notebook_path: ../src/features.ipynb
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.schema}

        - task_key: train_models
          environment_key: stock_env
          depends_on:
            - task_key: build_features
          notebook_task:
            notebook_path: ../src/train.ipynb
            base_parameters:
              catalog: ${var.catalog}

        - task_key: evaluate_model
          environment_key: stock_env
          depends_on:
            - task_key: train_models
          notebook_task:
            notebook_path: ../src/evaluate.ipynb
            base_parameters:
              catalog: ${var.catalog}
              max_validation_rmse: ${var.max_validation_rmse}

        - task_key: register_model
          depends_on:
            - task_key: evaluate_model
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.evaluate_model.values.eval_passed}}"
            right: "true"

        - task_key: register_model_run
          environment_key: stock_env
          depends_on:
            - task_key: register_model
              outcome: "true"
          notebook_task:
            notebook_path: ../src/register.ipynb
            base_parameters:
              catalog: ${var.catalog}
              min_improvement: ${var.min_improvement}

        - task_key: update_serving
          depends_on:
            - task_key: register_model_run
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.register_model_run.values.promoted}}"
            right: "true"

        - task_key: update_serving_run
          environment_key: stock_env
          depends_on:
            - task_key: update_serving
              outcome: "true"
          notebook_task:
            notebook_path: ../src/serve.ipynb
            base_parameters:
              catalog: ${var.catalog}
              target: ${bundle.target}

        - task_key: batch_inference
          environment_key: stock_env
          depends_on:
            - task_key: register_model_run
          notebook_task:
            notebook_path: ../src/batch_inference.ipynb
            base_parameters:
              catalog: ${var.catalog}

      environments:
        - environment_key: stock_env
          spec:
            environment_version: 2
            dependencies:
              - xgboost==2.1.4
              - lightgbm==4.5.0
              - catboost==1.2.8
              - yfinance                      # was previously installed via %pip (unpinned)
              - databricks-feature-engineering  # needed by the features task
